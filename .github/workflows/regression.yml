name: H4wkEye regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install report dependencies and test PDF reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pypdf>=5,<7"
      - name: Compile scanner
        run: python -m py_compile h4wkeye.py
      - name: Validate CLI help
        run: python h4wkeye.py --help
      - name: Run regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test_*.py; do
            echo "::group::${test_file}"
            python "${test_file}"
            echo "::endgroup::"
          done
